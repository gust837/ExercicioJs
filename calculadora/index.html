<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Calculadora</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="calc">
    <h1>Calculadora simples</h1>

    <label for="num1">Primeiro número</label>
    <input type="number" id="num1" placeholder="Ex.: 12" inputmode="decimal">

    <label for="operacao">Operação</label>
    <select id="operacao">
      <option value="soma">Soma (+)</option>
      <option value="subtracao">Subtração (−)</option>
      <option value="multiplicacao">Multiplicação (×)</option>
      <option value="divisao">Divisão (÷)</option>
    </select>

    <label for="num2">Segundo número</label>
    <input type="number" id="num2" placeholder="Ex.: 3" inputmode="decimal">

    <div class="botoes">
      <button class="principal" id="btnCalcular">Calcular</button>
      <button id="btnLimpar">Limpar</button>
    </div>

    <div class="visor" id="resultado" aria-live="polite">Resultado aparece aqui</div>
  </main>

  <script src="script.js"></script>
</body>
</html>
